apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: fuel-finder
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Debolar/fuel-finder.git
    targetRevision: main
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: fuel-finder
  syncPolicy:
    automated:
      prune: true
      selfHeal: true