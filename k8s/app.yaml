apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: fuel-finder
data:
  APP_ENV: kubernetes
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  namespace: fuel-finder
spec:
  replicas: 3
  selector:
    matchLabels:
      app: app
  template:
    metadata:
      labels:
        app: app
    spec:
      containers:
        - name: app
          image: ghcr.io/debolar/fuel-finder:85b31a15a55733c1b5a3b3cc534d1f7abf32adb0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: app-config
          env:
            - name: DB_USER
              valueFrom:
                secretKeyRef: { name: db-credentials, key: POSTGRES_USER }
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: db-credentials, key: POSTGRES_PASSWORD }
            - name: DB_NAME
              valueFrom:
                secretKeyRef: { name: db-credentials, key: POSTGRES_DB }
            - name: DATABASE_URL
              value: postgresql://$(DB_USER):$(DB_PASSWORD)@db:5432/$(DB_NAME)
          livenessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /ready, port: 8000 }
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: app
  namespace: fuel-finder
spec:
  type: NodePort
  selector:
    app: app
  ports:
    - port: 8000
      targetPort: 8000
      nodePort: 30090