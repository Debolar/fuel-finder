apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fuel-finder
  namespace: fuel-finder
spec:
  ingressClassName: traefik
  rules:
    - host: fuel.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: app
                port:
                  number: 8000